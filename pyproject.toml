[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice-assistant"
version = "1.0.0"
description = "A production-ready voice assistant utilizing Deepgram STT, OpenAI/Gemini LLM, and ElevenLabs/Edge-TTS."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mars"}
]
dependencies = [
    "python-dotenv>=1.0.0",
    "deepgram-sdk>=3.0.0",
    "openai>=1.4.0",
    "elevenlabs>=1.0.0",
    "edge-tts>=6.1.0",
    "pyaudio>=0.2.14",
    "rhasspy-silence>=0.4.0",
    "audioop-lts>=0.2.0; python_version>='3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
